[agent]
# Agent server configuration
ip = "0.0.0.0"  
port = 9002

# Force HTTPS for registrar connection (client)
registrar_ip = "mitm"
registrar_port = 8891

# Enable TLS for agent's server (for verifier connections)
tls_enabled = true
enable_agent_mtls = true

# Certificate directories and files
tls_dir = "/var/lib/keylime/cv_ca"
server_cert = "server-cert.crt"
server_key = "server-private.pem" 
trusted_server_ca = ["cacert.crt", "/etc/attacker_certs/attacker_ca.crt"]

# TPM configuration
tpm_sign_alg = "rsassa"
tpm_hash_alg = "sha256"