[tenant]
registrar_ip = keylime-registrar
registrar_port = 8890
verifier_ip = keylime-verifier
verifier_port = 8881

# Enable TLS for HTTPS communication
tls_enabled = false

# Trust both legitimate and attacker CAs
trusted_server_ca = ["/var/lib/keylime/cv_ca/cacert.crt", "/var/lib/keylime/cv_ca/attacker_ca.crt"]

# Disable EK certificate requirement for software TPM emulator
# WARNING: This setting bypasses EK certificate validation which reduces security
# This is acceptable for development/testing with software TPM emulators
require_ek_cert = False

# Since require_ek_cert is False, leave ek_check_script empty to skip additional checks
# This will allow the software TPM emulator to work without valid EK certificates
ek_check_script = 
